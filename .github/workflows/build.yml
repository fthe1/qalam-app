name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare project
        run: |
          unzip -q www.zip -d www
          cat > package.json <<'EOF'
          {"name":"qalam-app","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2","@capacitor/core":"^6.1.2"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.qalam.friend","appName":"صديقي قلم","webDir":"www"}
          EOF
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          if command -v magick >/dev/null; then IM="magick"; else IM="convert"; fi
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p android/app/src/main/res/mipmap-$n
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $IM www/icons/icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: npx cap sync android
      - name: Portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
